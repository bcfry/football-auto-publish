name: 诊断文章真实状态（一次性只读）

# 只读诊断：用发布器同款登录态进后台，查指定的几篇文章到底有没有真的发出去。
# 不发布、不删除、不改动线上任何内容。用完即删。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install playwright requests

      - name: 安装 Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: 写入登录态（复用 TOUTIAO_AUTH_GZ）
        run: |
          mkdir -p /tmp/auth
          echo "${{ secrets.TOUTIAO_AUTH_GZ }}" | base64 -d | python3 -c "import sys,gzip; sys.stdout.buffer.write(gzip.decompress(sys.stdin.buffer.read()))" > /tmp/auth/toutiao_auth.json
          test -s /tmp/auth/toutiao_auth.json || { echo "::error::登录态解压为空"; exit 1; }
          echo "登录态字节数: $(wc -c < /tmp/auth/toutiao_auth.json)"

      - name: 只读诊断
        env:
          TOUTIAO_AUTH_FILE: /tmp/auth/toutiao_auth.json
          DIAG_OUT: ${{ runner.temp }}/article-diag
        run: python3 scripts/diag_article_status.py

      - name: 上传诊断产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article-status-diag-${{ github.run_id }}
          path: ${{ runner.temp }}/article-diag/
          if-no-files-found: ignore
